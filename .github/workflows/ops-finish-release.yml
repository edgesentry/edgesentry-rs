# Recover a partially failed Release run without bumping the version again.
# Use when crates.io publish or Homebrew update did not complete for an existing tag.
name: Ops — finish release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag (e.g. v0.2.2)"
        required: true
        type: string
      publish_crates:
        description: "Publish missing crates from this ref (workspace version must match tag)"
        required: true
        type: boolean
        default: true
      update_homebrew:
        description: "Update homebrew-tap Formula/eds.rb for the tag"
        required: true
        type: boolean
        default: true

concurrency:
  group: ops-finish-release-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse

jobs:
  publish_crates:
    name: Publish missing crates.io packages
    if: ${{ inputs.publish_crates }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Verify workspace version matches tag
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          expected="${TAG_NAME#v}"
          actual="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          if [ "$actual" != "$expected" ]; then
            echo "Workspace version ${actual} does not match tag ${TAG_NAME} (expected ${expected})."
            echo "Refusing to publish mismatched versions."
            exit 1
          fi
          echo "Workspace version ${actual} matches ${TAG_NAME}."

      - name: Setup Rust
        run: rustup update stable && rustup default stable

      - name: Login crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "CRATES_IO_TOKEN secret is required"
            exit 1
          fi

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          set -euo pipefail

          publish_if_missing() {
            crate="$1"
            version="$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(p['version'] for p in data['packages'] if p['name']=='$crate'))")"
            url="https://crates.io/api/v1/crates/${crate}/${version}"

            if curl --silent --show-error --fail -A "edgesentry-rs-release" "$url" >/dev/null 2>&1; then
              echo "${crate}@${version} already exists on crates.io. Skipping publish."
              return 0
            fi

            echo "Publishing ${crate}@${version} ..."
            cargo publish --locked -p "$crate"
          }

          wait_for_crate() {
            crate="$1"
            version="$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; data=json.load(sys.stdin); print(next(p['version'] for p in data['packages'] if p['name']=='$crate'))")"
            url="https://crates.io/api/v1/crates/${crate}/${version}"
            echo "Waiting for ${crate}@${version} to appear on crates.io ..."
            for _ in $(seq 1 30); do
              if curl --silent --show-error --fail -A "edgesentry-rs-release" "$url" >/dev/null 2>&1; then
                echo "${crate}@${version} is available."
                return 0
              fi
              sleep 10
            done
            echo "Timed out waiting for ${crate}@${version} on crates.io"
            return 1
          }

          publish_if_missing edgesentry-zkp
          wait_for_crate edgesentry-zkp
          publish_if_missing edgesentry-audit
          publish_if_missing edgesentry-inspect

  update_homebrew:
    name: Update Homebrew tap formula
    if: ${{ inputs.update_homebrew }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate GitHub App token (scoped to homebrew-tap)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          repositories: homebrew-tap

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Update Formula/eds.rb
        env:
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ inputs.tag_name }}
        run: bash scripts/update-homebrew-formula.sh "${TAG_NAME}"
