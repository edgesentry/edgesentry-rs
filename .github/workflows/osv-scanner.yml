name: OSV-Scanner

on:
  schedule:
    # Wednesday 00:00 UTC = 08:00 SGT
    - cron: "0 0 * * 3"
  pull_request:
  workflow_dispatch:

# Advisories with no compatible upgrade are listed in /osv-scanner.toml
# (next to Cargo.lock). fail-on-vuln stays on; that file only suppresses
# the documented exceptions.
permissions:
  contents: read
  # Required to upload SARIF to code scanning.
  # See: https://github.com/github/codeql-action/issues/2117
  actions: read
  security-events: write

jobs:
  scan-scheduled:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      security-events: write
    # google/osv-scanner-action@v2.7.0
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932

  scan-pr:
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    # google/osv-scanner-action@v2.7.0
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932
