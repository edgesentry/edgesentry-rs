[package]
name = "edgesentry-inspect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description   = "Edge-first 3D scan vs. reference deviation detection for construction and maritime inspection"
keywords      = ["inspection", "point-cloud", "deviation", "ifc", "digital-twin"]
categories    = ["science", "computer-vision", "embedded"]
documentation = "https://edgesentry.github.io/edgesentry-rs/inspect/introduction/"

[lib]
name = "edgesentry_inspect"
path = "src/lib.rs"

[[bin]]
name = "edgesentry-inspect"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
# crates.io required for `cargo publish` (git-only deps are rejected).
# Keep in sync with the trilink-core release published on crates.io.
trilink-core = "0.1.1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rstar = "0.13"
# Must match trilink-core 0.1.1's glam (0.32.x); mismatch causes Mat4/Vec3 type errors.
glam = "0.32"
image = { version = "0.25", default-features = false, features = ["png"] }
toml = "1"
ureq = "3"
tempfile = "3"
tract-onnx = "0.23"

[dev-dependencies]
mockito  = "1"
tokio    = { version = "1", features = ["rt", "macros"] }
